<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NXT24 Countdown</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="glow-circle"></div>

    <img src="butterfly.png" class="butterfly butterfly-1" alt="">
    <img src="butterfly.png" class="butterfly butterfly-2" alt="">
    
    <div class="container">

        <div class="header">
            <img src="nxt24logo.png" class="logo" alt="NXT24 Logo">
            
            <div id="current-time">
                10:00:00 AM
            </div>
            
        </div>

        <div id="countdown">
            24:00:00
        </div>

        <div class="progress-container">
            <div id="progress-bar"></div>
        </div>

        <div class="status-row">

            <div id="progress-text">
                0% COMPLETE
            </div>

            <span class="divider">|</span>

            <div id="milestone">
                🚀 KICKOFF
            </div>

        </div>


        <div class="metrics">

            <div class="metric-card">
                <span>CONTENDERS</span>
                <h2>400+</h2>
            </div>

            <div class="metric-card">
                <span>TEAMS</span>
                <h2>40</h2>
            </div>

            <div class="metric-card">
                <span>CHALLENGES</span>
                <h2>20+</h2>
            </div>

            <div class="metric-card">
                <span>WINNING TEAMS</span>
                <h2>16</h2>
            </div>

        </div>

        <div class="journey" id="journey">
            DGS' 24-HOUR HACKATHON | 10–11 DECEMBER 2026
        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
